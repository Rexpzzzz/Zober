[pytest]
# Exclude large vendor directories (Blender, vcpkg) and virtualenvs from test collection
norecursedirs = tools/blender-5.0.1 tools/vcpkg tools/mbEditorPro/venv tools/mbEditorPro/.venv .venv venv env .git .github .tox .pytest_cache
python_files = test_*.py
# Disable doctest collection (text/binary files under repo root caused Unicode errors on Windows)
addopts = -p no:doctest
